<!DOCTYPE html>
<html lang="en" class="h-full bg-[#08070d]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrYa DCS</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100%; display: grid; place-items: center; padding: 24px; color: #eeeaf6; background: #08070d; font-family: system-ui, sans-serif; }
        main { width: min(520px, 100%); border: 1px solid #34303f; background: #15121d; padding: 28px; border-radius: 8px; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { color: #aaa3b8; line-height: 1.6; }
        a { display: inline-block; margin-top: 12px; color: white; background: #7c3aed; padding: 10px 16px; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>TrYa Discord Community Stream</h1>
        <p>{{ reason }}</p>
        <a href="{{ url_for('trya_dcs_player') }}">Try again</a>
    </main>
</body>
</html>

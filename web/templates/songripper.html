{% extends "base.html" %}
{% block title %}Songripper{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
            <span>💿</span>
            Songripper
        </h1>
        <p class="text-gray-400 text-sm mt-1">Suno URL rein, Audio als MP3 oder WAV herunterladen.</p>
    </div>

    <div class="bg-discord-dark rounded-xl border border-gray-700/50 overflow-hidden">
        <div class="p-5 border-b border-gray-700/50">
            <label class="block text-gray-400 text-xs mb-2">Suno Song URL oder UUID</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="songripper-url"
                    placeholder="https://suno.com/song/... oder https://suno.com/s/..."
                    class="flex-1 bg-discord-darker border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:border-discord-blurple focus:outline-none">
                <button type="button" onclick="loadSongripperAudio()"
                    class="px-4 py-2 bg-discord-blurple hover:bg-discord-blurple/80 text-white rounded-lg text-sm font-semibold transition-colors">
                    Laden
                </button>
            </div>
            <div class="mt-5 pt-4 border-t border-gray-700/40">
                <p class="text-gray-500 text-[11px] mb-2">Tesla-Coil Export · Mono · zweistufiges Rechtecksignal</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <button type="button" id="songripper-square-wav-btn" onclick="downloadSongripperSquare('wav')" disabled
                        class="flex-1 px-3 py-1.5 border border-gray-700 hover:border-gray-600 disabled:opacity-40 text-gray-500 hover:text-gray-300 rounded-lg text-xs transition-colors">
                        Square WAV
                    </button>
                    <button type="button" id="songripper-square-mp3-btn" onclick="downloadSongripperSquare('mp3')" disabled
                        class="flex-1 px-3 py-1.5 border border-gray-700 hover:border-gray-600 disabled:opacity-40 text-gray-500 hover:text-gray-300 rounded-lg text-xs transition-colors">
                        Square MP3
                    </button>
                </div>
            </div>
            <div class="mt-3 h-1 bg-discord-darker rounded overflow-hidden">
                <div id="songripper-progress" class="h-full bg-discord-blurple transition-all" style="width:0%"></div>
            </div>
            <p id="songripper-status" class="text-gray-500 text-xs mt-2">Bereit.</p>
        </div>

        <div id="songripper-meta" class="hidden p-5 border-b border-gray-700/50">
            <div class="flex items-start gap-4">
                <img id="songripper-artwork" src="" alt=""
                    class="hidden w-20 h-20 rounded-lg object-cover bg-discord-darker border border-gray-700">
                <div class="min-w-0 flex-1">
                    <h2 id="songripper-title" class="text-white font-semibold text-lg truncate">—</h2>
                    <p id="songripper-author" class="text-gray-400 text-sm truncate">—</p>
                    <p id="songripper-duration" class="text-gray-500 text-xs mt-1">—</p>
                </div>
            </div>
        </div>

        <div class="p-5 space-y-4">
            <audio id="songripper-player" controls crossorigin="anonymous"
                class="w-full rounded-lg accent-discord-blurple"></audio>
            <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" id="songripper-mp3-btn" onclick="downloadSongripperAudio('mp3')" disabled
                    class="flex-1 px-4 py-2 bg-green-600/20 hover:bg-green-600/40 disabled:bg-gray-700/30 disabled:text-gray-500 text-green-300 rounded-lg text-sm font-semibold transition-colors">
                    ⬇ MP3 herunterladen
                </button>
                <button type="button" id="songripper-wav-btn" onclick="downloadSongripperAudio('wav')" disabled
                    class="flex-1 px-4 py-2 bg-purple-600/20 hover:bg-purple-600/40 disabled:bg-gray-700/30 disabled:text-gray-500 text-purple-300 rounded-lg text-sm font-semibold transition-colors">
                    ⬇ WAV herunterladen
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let songripperAudioCtx = null;
let songripperMeta = null;
let songripperAudioBuffer = null;
let songripperAudioBytes = null;
let songripperAudioUrl = '';
let songripperAudioId = '';
let songripperSourceExt = 'mp3';

function songripperStatus(text) {
    document.getElementById('songripper-status').textContent = text;
}

function songripperProgress(value) {
    document.getElementById('songripper-progress').style.width = `${value}%`;
}

function songripperExtractId(raw) {
    const value = (raw || '').trim();
    const uuid = value.match(/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/i);
    if (uuid) return uuid[0];
    const share = value.match(/\/s\/([A-Za-z0-9_-]+)/);
    if (share) return share[1];
    return value;
}

function songripperSafeName() {
    const title = songripperMeta && songripperMeta.title ? songripperMeta.title : 'suno_song';
    return title.replace(/[^a-zA-Z0-9_\-\s]/g, '').replace(/\s+/g, '_').substring(0, 60) || 'suno_song';
}

function songripperFormatTime(seconds) {
    if (!Number.isFinite(seconds)) return '—';
    const m = Math.floor(seconds / 60);
    const s = Math.round(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

async function loadSongripperAudio() {
    const raw = document.getElementById('songripper-url').value;
    const id = songripperExtractId(raw);
    if (!id) {
        songripperStatus('Bitte eine Suno URL oder UUID eingeben.');
        return;
    }
    document.getElementById('songripper-mp3-btn').disabled = true;
    document.getElementById('songripper-wav-btn').disabled = true;
    document.getElementById('songripper-square-wav-btn').disabled = true;
    document.getElementById('songripper-square-mp3-btn').disabled = true;
    songripperMeta = null;
    songripperAudioBuffer = null;
    songripperAudioBytes = null;
    songripperAudioId = '';
    songripperProgress(5);
    songripperStatus('Metadaten werden geladen...');

    const metaResp = await fetch(`/songripper/resolve?id=${encodeURIComponent(id)}`);
    const meta = await metaResp.json();
    if (!metaResp.ok || meta.error) {
        songripperStatus(meta.error || 'Suno Song konnte nicht aufgelöst werden.');
        songripperProgress(0);
        return;
    }
    songripperMeta = meta;
    const audioId = meta.realId || id;
    songripperAudioId = audioId;
    document.getElementById('songripper-meta').classList.remove('hidden');
    document.getElementById('songripper-title').textContent = meta.title || audioId;
    document.getElementById('songripper-author').textContent = meta.author || '';
    const artwork = document.getElementById('songripper-artwork');
    if (meta.artwork) {
        artwork.src = meta.artwork;
        artwork.classList.remove('hidden');
    } else {
        artwork.classList.add('hidden');
    }

    songripperProgress(25);
    songripperStatus('Audio wird geladen...');
    songripperAudioUrl = `https://cdn1.suno.ai/${audioId}.mp3`;
    songripperSourceExt = 'mp3';
    let audioResp = await fetch(songripperAudioUrl);
    if (!audioResp.ok) {
        songripperAudioUrl = `https://cdn1.suno.ai/${audioId}.m4a`;
        songripperSourceExt = 'm4a';
        songripperStatus('MP3 nicht verfügbar, M4A wird geladen...');
        audioResp = await fetch(songripperAudioUrl);
    }
    if (!audioResp.ok) {
        songripperStatus(`Audio nicht verfügbar (${audioResp.status}).`);
        songripperProgress(0);
        return;
    }
    songripperAudioBytes = await audioResp.arrayBuffer();
    const player = document.getElementById('songripper-player');
    player.src = songripperAudioUrl;

    songripperProgress(60);
    songripperStatus('Audio wird decodiert...');
    if (!songripperAudioCtx) songripperAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    songripperAudioBuffer = await songripperAudioCtx.decodeAudioData(songripperAudioBytes.slice(0));
    document.getElementById('songripper-duration').textContent = `Dauer: ${songripperFormatTime(songripperAudioBuffer.duration)}`;
    document.getElementById('songripper-mp3-btn').disabled = false;
    document.getElementById('songripper-wav-btn').disabled = false;
    document.getElementById('songripper-square-wav-btn').disabled = false;
    document.getElementById('songripper-square-mp3-btn').disabled = false;
    songripperProgress(100);
    songripperStatus('Bereit zum Download.');
}

function songripperSaveBlob(blob, filename) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}

async function downloadSongripperSquare(format) {
    if (!songripperAudioId) {
        alert('Kein Audio geladen.');
        return;
    }
    const safeName = songripperSafeName();
    const btn = document.getElementById(`songripper-square-${format}-btn`);
    btn.disabled = true;
    songripperStatus(`Square-${format.toUpperCase()} wird für die Teslaspule erzeugt...`);
    try {
        const filename = `${safeName}_square-wave.${format}`;
        const url = `/songripper/download-square?id=${encodeURIComponent(songripperAudioId)}&format=${encodeURIComponent(format)}&filename=${encodeURIComponent(filename)}`;
        const resp = await fetch(url);
        if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            throw new Error(data.error || `Square-Wave Export fehlgeschlagen (${resp.status})`);
        }
        const blob = await resp.blob();
        songripperSaveBlob(blob, filename);
        songripperStatus(`Square-${format.toUpperCase()} heruntergeladen.`);
    } catch (err) {
        songripperStatus(err.message || String(err));
    } finally {
        btn.disabled = false;
    }
}

async function downloadSongripperAudio(format) {
    const safeName = songripperSafeName();
    if (format === 'mp3') {
        if (!songripperAudioId) {
            alert('Kein Audio geladen.');
            return;
        }
        const btn = document.getElementById('songripper-mp3-btn');
        btn.disabled = true;
        songripperStatus('MP3 wird serverseitig neu codiert...');
        try {
            const url = `/songripper/download-mp3?id=${encodeURIComponent(songripperAudioId)}&filename=${encodeURIComponent(safeName + '.mp3')}`;
            const resp = await fetch(url);
            if (!resp.ok) {
                const data = await resp.json().catch(() => ({}));
                throw new Error(data.error || `Download fehlgeschlagen (${resp.status})`);
            }
            const blob = await resp.blob();
            songripperSaveBlob(blob, `${safeName}.mp3`);
            songripperStatus('Korrigierte MP3 heruntergeladen.');
        } catch (err) {
            songripperStatus(err.message || String(err));
        } finally {
            btn.disabled = false;
        }
        return;
    }

    if (!songripperAudioBuffer) {
        alert('Kein decodiertes Audio geladen.');
        return;
    }
    const samples = songripperAudioBuffer.getChannelData(0);
    const sampleRate = songripperAudioBuffer.sampleRate;
    const bitsPerSample = 16;
    const bytesPerSample = bitsPerSample / 8;
    const blockAlign = bytesPerSample;
    const dataLen = samples.length * blockAlign;
    const wav = new ArrayBuffer(44 + dataLen);
    const view = new DataView(wav);
    view.setUint32(0, 0x52494646, false);
    view.setUint32(4, 36 + dataLen, true);
    view.setUint32(8, 0x57415645, false);
    view.setUint32(12, 0x666d7420, false);
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitsPerSample, true);
    view.setUint32(36, 0x64617461, false);
    view.setUint32(40, dataLen, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
    }
    songripperSaveBlob(new Blob([wav], {type: 'audio/wav'}), `${safeName}.wav`);
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Suno Player{% endblock %}
{% block content %}
<style>
    .player-wrap{max-width:750px;margin:0 auto}
    /* -- Top bar: filters + feature buttons -- */
    .top-bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
    .top-bar select,.top-bar input[type=number]{padding:6px 10px;font-size:12px;border:1px solid #333;border-radius:8px;background:#1a1a1a;color:#eee}
    .top-bar select{min-width:130px}
    #timeSel{min-width:110px}
    .top-bar input[type=number]{width:64px}
    .icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #5865F2;border-radius:8px;background:#5865F2;color:#fff;cursor:pointer;font-size:16px;transition:all .15s;flex-shrink:0}
    .icon-btn:hover{background:#4752c4;border-color:#4752c4}
    .icon-btn.on{background:#3b2f7e;border-color:#7c6ff0;box-shadow:0 0 6px rgba(88,101,242,.4)}
    .icon-btn:disabled{opacity:.35;cursor:not-allowed}
    .icon-btn.primary{background:#5865F2;color:#fff;border-color:transparent}
    .icon-btn.primary:hover{background:#4752c4}
    #load-status{font-size:11px;color:#666;padding-bottom:2px;white-space:nowrap}
    /* -- Now Playing card -- */
    .np-card{display:flex;gap:14px;align-items:flex-start}
    .artwork-wrap{width:162px;flex-shrink:0;display:none;position:relative;border-radius:10px;overflow:hidden;background:#1a1a1a;aspect-ratio:1/1;cursor:pointer;transition:aspect-ratio .2s}
    .artwork-wrap.has-video{aspect-ratio:9/16}
    #artwork,#artwork-video{width:100%;height:100%;object-fit:cover;display:block}
    #artwork-video{display:none}
    .artwork-wrap.has-video #artwork{display:none}
    .artwork-wrap.has-video #artwork-video{display:block}
    .np-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    #tinfo{font-size:16px;color:#eee;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #sub{font-size:12px;color:#888}
    #p-status{font-size:11px;color:#aa8}
    .link-row{display:flex;gap:12px;flex-wrap:wrap}
    #suno-link,#artist-link{font-size:11px;color:#b8b4f0;text-decoration:none;display:none}
    #suno-link:hover,#artist-link:hover{text-decoration:underline}
    /* -- Transport + progress -- */
    .transport{display:flex;align-items:center;gap:10px;margin-top:8px}
    .tp-btn{width:44px;height:44px;border:0;padding:0;background:transparent center/contain no-repeat;cursor:pointer;flex-shrink:0;transition:transform .1s;filter:drop-shadow(0 0 4px rgba(167,139,250,.25))}
    .tp-btn:hover{transform:scale(1.06)}
    .tp-btn:active{transform:scale(.95)}
    .tp-btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
    .tp-btn:disabled:hover{transform:none}
    .tp-play{width:54px;height:54px}
    .tp-prev{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_prev.webp') }}")}
    .tp-prev:hover{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_prev_hover.webp') }}")}
    .tp-next{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_next.webp') }}")}
    .tp-next:hover{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_next_hover.webp') }}")}
    .tp-play{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_play.webp') }}")}
    .tp-play:hover{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_play_hover.webp') }}")}
    .tp-play.playing{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_pause.webp') }}")}
    .tp-play.playing:hover{background-image:url("{{ url_for('static',filename='playerbuttons/TrYa-Button_pause_hover.webp') }}")}
    .seek-bar{flex:1;display:flex;align-items:center;gap:6px}
    .seek-track{flex:1;height:4px;background:#333;border-radius:2px;cursor:pointer;position:relative}
    .seek-fill{height:100%;background:#5865F2;border-radius:2px;pointer-events:none;width:0%}
    .seek-time{font-size:11px;color:#777;min-width:36px;text-align:center}
    .vol-wrap{display:flex;align-items:center;gap:4px}
    .vol-wrap input[type=range]{width:70px;accent-color:#5865F2}
    /* -- Auto-next bar -- */
    .auto-row{display:flex;align-items:center;gap:8px;margin-top:6px}
    .auto-row span{font-size:12px;color:#555}
    .auto-row input[type=range]{width:100px;accent-color:#5865F2}
    #rlbl{font-size:12px;color:#666}
    #cntd{font-size:12px;font-weight:600;color:#b8b4f0}
    /* -- Timer bar -- */
    #timerbar{height:2px;background:#333;border-radius:1px;margin-top:4px;overflow:hidden}
    #timerprog{height:100%;width:0%;background:#5865F2}
    /* -- Reactions -- */
    .react-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .react-btn{padding:4px 10px;font-size:16px;border:1px solid #333;border-radius:20px;background:transparent;cursor:pointer;transition:all .15s;position:relative}
    .react-btn:hover{background:#2a2a3a;border-color:#5865F2}
    .react-btn.reacted{background:#2d2456;border-color:#5865F2}
    .react-btn .rc{font-size:10px;color:#888;margin-left:2px;vertical-align:middle}
    /* -- Lyrics -- */
    #lyrics{display:none;margin-top:10px;padding:10px 12px;background:#111;border-radius:8px;font-size:12px;color:#aaa;line-height:1.7;max-height:200px;overflow-y:auto;white-space:pre-wrap}
    /* -- Queue -- */
    #queue{max-height:400px;overflow-y:auto;margin-top:8px}
    .qi{display:flex;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px;color:#888;cursor:pointer;align-items:center}
    .qi:hover{background:#1a1a1a}
    .qi.on{background:#2d2456;color:#b8b4f0}
    .qi .n{min-width:22px;text-align:right;font-weight:500;flex-shrink:0}
    .qi .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qi .a{font-size:11px;opacity:.6;flex-shrink:0;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qi .rc{font-size:10px;color:#666;flex-shrink:0;min-width:24px;text-align:right}
    .qi .link{font-size:11px;color:#555;text-decoration:none;flex-shrink:0}
    .qi .link:hover{color:#b8b4f0}
</style>

<div class="player-wrap">
    <h2 class="text-2xl font-bold text-white mb-4">🎵 Suno Player</h2>

    <!-- Top bar: filters + feature buttons -->
    <div class="bg-discord-dark rounded-xl border border-gray-700/50 p-4 mb-3">
        <div class="top-bar">
            <select id="channelSel" title="Channel">
                <option value="">All channels</option>
                {% for ch in channels %}
                <option value="{{ ch.id }}">#{{ ch.name }}</option>
                {% endfor %}
            </select>
            <select id="timeSel" title="Time range">
                <option value="0">All time</option>
                <option value="1">Last 1 day</option>
                <option value="2">Last 2 days</option>
                <option value="3">Last 3 days</option>
                <option value="7">Last 7 days</option>
                <option value="14">Last 14 days</option>
                <option value="30">Last 30 days</option>
            </select>
            <select id="artistSel" title="Suno artist">
                <option value="">All artists</option>
            </select>
            <input type="number" id="limitInput" value="20" min="1" max="500" title="Songs to load">
            <button class="icon-btn primary" id="btnFetch" title="Load Songs">⬇</button>
            <button class="icon-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">🔀</button>
            <button class="icon-btn" id="btnHidePlayed" onclick="toggleHidePlayed()" title="Hide Played">👁</button>
            <button class="icon-btn" id="btnAutoload" onclick="toggleAutoload()" title="Auto-load more songs">♾</button>
            <span id="load-status"></span>
        </div>
    </div>

    <!-- Player card -->
    <div class="bg-discord-dark rounded-xl border border-gray-700/50 p-4 mb-3">
        <!-- Now Playing -->
        <div class="np-card">
            <div class="artwork-wrap" id="artwork-wrap" onclick="var l=document.getElementById('suno-link');if(l.href)window.open(l.href,'_blank')">
                <img id="artwork" src="" alt="">
                <video id="artwork-video" autoplay loop muted playsinline></video>
            </div>
            <div class="np-info">
                <div id="tinfo">—</div>
                <div id="sub"></div>
                <div id="p-status"></div>
                <div class="link-row"><a id="suno-link" href="#" target="_blank">↗ Open on Suno</a><a id="artist-link" href="#" target="_blank">↗ Artist profile</a></div>
            </div>
        </div>

        <!-- Transport controls + seek bar -->
        <div class="transport">
            <button class="tp-btn tp-prev" onclick="prev()" title="Previous"></button>
            <button class="tp-btn tp-play" id="btnPlay" disabled title="Play / Pause"></button>
            <button class="tp-btn tp-next" onclick="next()" title="Next"></button>
            <div class="seek-bar">
                <span class="seek-time" id="timeNow">0:00</span>
                <div class="seek-track" id="seekTrack">
                    <div class="seek-fill" id="seekFill"></div>
                </div>
                <span class="seek-time" id="timeDur">0:00</span>
            </div>
            <div class="vol-wrap">
                <span style="font-size:14px;color:#888">🔊</span>
                <input type="range" id="volSlider" min="0" max="100" value="80">
            </div>
        </div>

        <!-- Frequency Spectrum -->
        <canvas id="spectrum-canvas" style="width:100%;height:60px;background:transparent;margin:8px 0;display:block"></canvas>

        <!-- Auto-Next -->
        <div class="auto-row">
            <span>Auto-Next</span>
            <input type="range" id="rng" min="0" max="300" step="15" value="0">
            <span id="rlbl">OFF</span>
            <span id="cntd"></span>
        </div>
        <div id="timerbar"><div id="timerprog"></div></div>

        <!-- Emoji Reactions -->
        <div class="react-row" id="reactRow" style="display:none">
            <button class="react-btn" data-emoji="💜" onclick="react(this)">💜</button>
            <button class="react-btn" data-emoji="💯" onclick="react(this)">💯</button>
            <button class="react-btn" data-emoji="👏🏻" onclick="react(this)">👏🏻</button>
            <button class="react-btn" data-emoji="❤️‍🔥" onclick="react(this)">❤️‍🔥</button>
            <button class="react-btn" data-emoji="🫶🏻" onclick="react(this)">🫶🏻</button>
            <button class="react-btn" data-emoji="🔥" onclick="react(this)">🔥</button>
        </div>

        <!-- Lyrics -->
        <div id="lyrics"></div>
    </div>

    <!-- Queue -->
    <div class="bg-discord-dark rounded-xl border border-gray-700/50 p-4">
        <h3 class="text-white font-semibold text-sm mb-1">Queue <span id="qcount" class="text-gray-500 font-normal"></span></h3>
        <div id="queue"></div>
    </div>
</div>

<audio id="player" preload="none" crossorigin="anonymous" style="display:none"></audio>

<script>
var T=[], cur=-1, tSec=0, cd=0, tick=null, shuffled=false, shuffleOrder=[];
var playedSet=new Set(), hidePlayed=false, loadOffset=0, autoloadEnabled=false;
var artistFilter='', timeFilterDays=0;
var player=document.getElementById('player');
var REACT_EMOJIS=['💜','💯','👏🏻','❤️‍🔥','🫶🏻','🔥'];

/* --- UUID extraction from Suno URLs --- */
var SUNO_RE=/(?:https?:\/\/)?(?:app\.)?suno\.(?:com|ai)\/(?:song|track|s)\/([a-zA-Z0-9_-]{8,})/;
function extractUUID(url){var m=url.match(SUNO_RE);return m?m[1]:null;}
function isFullUUID(id){return /-/.test(id);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function setStatus(msg){document.getElementById('p-status').textContent=msg;}

/* --- Load songs from API --- */
async function fetchSongs(append){
    var ch=document.getElementById('channelSel').value;
    var limit=parseInt(document.getElementById('limitInput').value)||20;
    var ls=document.getElementById('load-status');
    if(!append){loadOffset=0;T=[];cur=-1;playedSet.clear();}
    ls.textContent='Loading…';
    try{
        var url='/api/player-songs?limit='+limit+'&offset='+loadOffset;
        if(ch)url+='&channel_id='+ch;
        var resp=await fetch(url);
        if(!resp.ok){ls.textContent='Error '+resp.status;return;}
        var songs=await resp.json();
        var added=0;
        var existingIds=new Set(T.map(function(t){return t.url;}));
        songs.forEach(function(s){
            if(existingIds.has(s.url))return;
            var uuid=extractUUID(s.url);
            if(uuid){
                T.push({
                    id:uuid, title:s.song_title||uuid, author:s.user_name||'',
                    url:s.url, reactions:s.reaction_count||0, isUUID:isFullUUID(uuid),
                    messageId:s.message_id, channelId:s.channel_id, userId:s.user_id,
                    posted_at:s.posted_at||0
                });
                added++;
            }
        });
        loadOffset+=limit;
        ls.textContent=T.length+' songs'+(append?' (+'+added+' new)':' loaded');
        document.getElementById('qcount').textContent='('+T.length+')';
        if(shuffled)buildShuffleOrder();
        renderQ();
        document.getElementById('btnPlay').disabled=T.length===0;
        resolveAllTitles();
    }catch(e){ls.textContent='Error: '+e.message;}
}

/* --- Autoload more when all songs played --- */
async function maybeAutoload(){
    if(!autoloadEnabled)return;
    var allPlayed=true;
    for(var i=0;i<T.length;i++){if(!playedSet.has(getPlayIndex(i))){allPlayed=false;break;}}
    if(allPlayed&&T.length>0){
        document.getElementById('load-status').textContent='Auto-loading more…';
        await fetchSongs(true);
    }
}

/* --- Background batch title resolver --- */
async function resolveAllTitles(){
    var pending=[];
    for(var i=0;i<T.length;i++){if(needsTitle(T[i]))pending.push(i);}
    if(!pending.length)return;
    var ls=document.getElementById('load-status');
    var done=0;
    for(var b=0;b<pending.length;b+=3){
        var batch=pending.slice(b,b+3);
        await Promise.all(batch.map(async function(idx){
            var e=T[idx],uuid=e.id;
            if(!e.isUUID){var resolved=await resolveShortId(e.id);if(resolved){uuid=resolved;e.id=resolved;e.isUUID=true;}else return;}
            var meta=await fetchSunoMeta(uuid);
            if(meta){if(meta.title)e.title=meta.title;if(meta.image_url)e.imageUrl=meta.image_url;if(meta.artist)e.sunoArtist=meta.artist;if(meta.video_url)e.videoUrl=meta.video_url;if(meta.handle)e.sunoHandle=meta.handle;}
            done++;
        }));
        ls.textContent=T.length+' songs — resolving ('+done+'/'+pending.length+')';
        renderQ();updateArtistOptions();
    }
    ls.textContent=T.length+' songs ready';renderQ();updateArtistOptions();
}

async function resolveShortId(shortId){
    try{var r=await fetch('/api/suno-resolve/'+encodeURIComponent(shortId));if(r.ok){var d=await r.json();return d.uuid||null;}}catch(e){}return null;
}
async function fetchSunoMeta(uuid){
    try{var r=await fetch('/api/suno-lyrics/'+encodeURIComponent(uuid));if(r.ok)return await r.json();}catch(e){}return null;
}

function showLyrics(text){var el=document.getElementById('lyrics');el.style.display=text?'block':'none';el.textContent=text||'';}

function setArtwork(uuid,imageUrl,videoUrl){
    var wrap=document.getElementById('artwork-wrap');
    var img=document.getElementById('artwork');
    var vid=document.getElementById('artwork-video');
    if(!uuid){wrap.style.display='none';vid.removeAttribute('src');vid.load();return;}
    wrap.style.display='block';
    // Image fallback chain
    if(imageUrl){img.src=imageUrl;img.onerror=function(){img.src='https://cdn1.suno.ai/image_large_'+uuid+'.jpeg';img.onerror=null;};}
    else{img.src='https://cdn1.suno.ai/image_large_'+uuid+'.jpeg';img.onerror=function(){img.src='https://cdn1.suno.ai/image_'+uuid+'.jpeg';img.onerror=null;};}
    // Video cover handling
    if(videoUrl){
        if(vid.src!==videoUrl){vid.src=videoUrl;vid.load();}
        wrap.classList.add('has-video');
        // Adjust aspect ratio once metadata loads (in case it's not 9:16)
        vid.onloadedmetadata=function(){
            if(vid.videoWidth&&vid.videoHeight){
                wrap.style.aspectRatio=vid.videoWidth+' / '+vid.videoHeight;
            }
        };
        vid.onerror=function(){wrap.classList.remove('has-video');wrap.style.aspectRatio='';};
    }else{
        wrap.classList.remove('has-video');
        wrap.style.aspectRatio='';
        vid.removeAttribute('src');vid.load();
    }
}

function setSunoLink(uuid){
    var link=document.getElementById('suno-link');
    if(!uuid){link.style.display='none';return;}
    link.href='https://suno.com/song/'+uuid;link.style.display='inline-block';
}

function setArtistLink(handle){
    var link=document.getElementById('artist-link');
    if(!handle){link.style.display='none';return;}
    link.href='https://suno.com/@'+handle;link.style.display='inline-block';
}

/* --- Filters --- */
function isFiltered(i){
    var e=T[i];if(!e)return true;
    // Time filter
    if(timeFilterDays>0&&e.posted_at){
        var cutoff=Math.floor(Date.now()/1000)-timeFilterDays*86400;
        if(e.posted_at<cutoff)return true;
    }
    // Artist filter (Suno artist name)
    if(artistFilter&&(e.sunoArtist||'')!==artistFilter)return true;
    return false;
}

function updateArtistOptions(){
    var sel=document.getElementById('artistSel');
    var desired=sel.value||artistFilter||'';
    var names={};
    for(var i=0;i<T.length;i++){var a=T[i].sunoArtist;if(a)names[a]=1;}
    var sorted=Object.keys(names).sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase());});
    var html='<option value="">All artists</option>';
    for(var j=0;j<sorted.length;j++){
        var n=sorted[j];
        html+='<option value="'+esc(n)+'"'+(n===desired?' selected':'')+'>'+esc(n)+'</option>';
    }
    sel.innerHTML=html;
}

/* --- Playback --- */
function needsTitle(e){
    if(!e.title)return true;
    if(/^[a-zA-Z0-9_-]{8,22}$/.test(e.title))return true;
    if(/^[a-f0-9-]{36}$/.test(e.title))return true;
    return false;
}

async function playTrack(uuid,idx){
    setStatus('Loading…');
    var realIdx=getPlayIndex(idx);var e=T[realIdx];
    setArtwork(uuid,e.imageUrl||null,e.videoUrl||null);setSunoLink(uuid);setArtistLink(e.sunoHandle||null);
    player.src='https://cdn1.suno.ai/'+uuid+'.mp3';
    player.oncanplay=function(){setStatus('');};
    player.onerror=function(){setStatus('⚠ Could not load audio');};
    player.play().catch(function(){setStatus('Press ▶ to play');});
    updatePlayBtn();
    fetchSunoMeta(uuid).then(function(meta){
        if(!meta||cur!==idx)return;
        if(meta.lyrics)showLyrics(meta.lyrics);
        var changed=false;
        if(meta.title&&needsTitle(e)){e.title=meta.title;document.getElementById('tinfo').textContent=meta.title;changed=true;}
        if(meta.video_url)e.videoUrl=meta.video_url;
        if(meta.image_url||meta.video_url){if(meta.image_url)e.imageUrl=meta.image_url;setArtwork(uuid,e.imageUrl||null,e.videoUrl||null);}
        if(meta.artist&&!e.sunoArtist){e.sunoArtist=meta.artist;changed=true;updateArtistOptions();}
        if(meta.handle&&!e.sunoHandle){e.sunoHandle=meta.handle;setArtistLink(meta.handle);}
        if(changed){updateSub(e,idx);renderQ();}
    });
}

function updateSub(e,i){
    var parts=[(i+1)+' / '+T.length];
    if(e.author)parts.push(e.author);
    if(e.sunoArtist&&e.sunoArtist!==e.author)parts.push('🎤 '+e.sunoArtist);
    if(e.reactions)parts.push(e.reactions+' ❤');
    document.getElementById('sub').textContent=parts.join(' · ');
}

function getPlayIndex(i){return shuffled&&shuffleOrder.length?shuffleOrder[i]:i;}

function updatePlayBtn(){
    var btn=document.getElementById('btnPlay');
    var playing=!player.paused&&!player.ended;
    btn.classList.toggle('playing',playing);
}

async function play(i){
    if(i<0||i>=T.length)return;
    var realIdx=getPlayIndex(i);cur=i;playedSet.add(realIdx);
    var e=T[realIdx];
    document.getElementById('tinfo').textContent=e.title;
    updateSub(e,i);showLyrics(null);
    document.getElementById('reactRow').style.display='flex';
    updateReactBtns();
    renderQ();resetCd();
    var uuid;
    if(e.isUUID){uuid=e.id;}else{setStatus('Resolving…');uuid=await resolveShortId(e.id);}
    if(uuid){if(!e.isUUID){e.id=uuid;e.isUUID=true;renderQ();}playTrack(uuid,i);}
    else{player.src='';setArtwork(null);setStatus('⚠ Could not resolve');updatePlayBtn();}
}

player.addEventListener('ended',function(){
    updatePlayBtn();
    maybeAutoload().then(function(){next();});
});
player.addEventListener('play',function(){updatePlayBtn();});
player.addEventListener('pause',function(){updatePlayBtn();});

function _skip(i){var ri=getPlayIndex(i);return isFiltered(ri)||(hidePlayed&&playedSet.has(ri));}
function prev(){var i=cur-1;while(i>=0&&_skip(i))i--;if(i>=0)play(i);}
function next(){var i=cur+1;while(i<T.length&&_skip(i))i++;if(i<T.length)play(i);else stopCd();}

/* --- Seek bar --- */
player.addEventListener('timeupdate',function(){
    if(!player.duration)return;
    var pct=(player.currentTime/player.duration)*100;
    document.getElementById('seekFill').style.width=pct+'%';
    document.getElementById('timeNow').textContent=fmt(player.currentTime);
});
player.addEventListener('loadedmetadata',function(){document.getElementById('timeDur').textContent=fmt(player.duration);});
document.getElementById('seekTrack').addEventListener('click',function(ev){
    if(!player.duration)return;
    var rect=this.getBoundingClientRect();var pct=(ev.clientX-rect.left)/rect.width;
    player.currentTime=pct*player.duration;
});

/* Volume */
document.getElementById('volSlider').oninput=function(){player.volume=this.value/100;};
player.volume=0.8;

/* --- Shuffle --- */
function toggleShuffle(){shuffled=!shuffled;document.getElementById('btnShuffle').classList.toggle('on',shuffled);if(shuffled)buildShuffleOrder();renderQ();}
function buildShuffleOrder(){
    shuffleOrder=[];for(var i=0;i<T.length;i++)shuffleOrder.push(i);
    for(var i=shuffleOrder.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffleOrder[i];shuffleOrder[i]=shuffleOrder[j];shuffleOrder[j]=t;}
}

/* --- Auto-Next Timer --- */
function resetCd(){
    stopCd();if(!tSec)return;cd=tSec;
    document.getElementById('cntd').textContent='→ '+fmt(cd);
    document.getElementById('timerprog').style.cssText='transition:none;width:0%';
    setTimeout(function(){document.getElementById('timerprog').style.cssText='transition:width '+tSec+'s linear;width:100%';},50);
    tick=setInterval(function(){cd--;document.getElementById('cntd').textContent='→ '+fmt(cd);if(cd<=0)next();},1000);
}
function stopCd(){clearInterval(tick);tick=null;document.getElementById('cntd').textContent='';document.getElementById('timerprog').style.cssText='width:0%';}

/* --- Hide Played --- */
function toggleHidePlayed(){hidePlayed=!hidePlayed;document.getElementById('btnHidePlayed').classList.toggle('on',hidePlayed);renderQ();}

/* --- Autoload toggle --- */
function toggleAutoload(){autoloadEnabled=!autoloadEnabled;document.getElementById('btnAutoload').classList.toggle('on',autoloadEnabled);saveSettings();}

/* --- Emoji Reactions --- */
function updateReactBtns(){
    /* Reset all reaction buttons */
    var btns=document.querySelectorAll('.react-btn');
    btns.forEach(function(b){b.classList.remove('reacted');});
}

async function react(btn){
    if(cur<0)return;
    var emoji=btn.getAttribute('data-emoji');
    var realIdx=getPlayIndex(cur);var e=T[realIdx];
    if(!e.messageId){setStatus('⚠ No message ID — cannot save reaction');return;}
    btn.classList.toggle('reacted');
    try{
        await fetch('/api/player-react',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message_id:e.messageId,channel_id:e.channelId,song_url:e.url,post_author_id:e.userId,emoji:emoji,song_title:e.title})
        });
    }catch(ex){console.error('Reaction failed',ex);}
}

/* --- Queue Rendering --- */
function renderQ(){
    var html='',shown=0;
    for(var i=0;i<T.length;i++){
        var realIdx=getPlayIndex(i);var t=T[realIdx];
        if(i!==cur&&isFiltered(realIdx))continue;
        if(hidePlayed&&i!==cur&&playedSet.has(realIdx))continue;
        shown++;
        var url=t.isUUID?'https://suno.com/song/'+t.id:'https://suno.com/s/'+t.id;
        var rc=t.reactions?'<span class="rc">'+t.reactions+' ❤</span>':'';
        html+='<div class="qi'+(i===cur?' on':'')+'" onclick="play('+i+')">'
            +'<span class="n">'+(i+1)+'</span>'
            +'<span class="t">'+esc(t.title)+'</span>'
            +'<span class="a">'+esc(t.sunoArtist||t.author)+'</span>'
            +rc
            +'<a href="'+url+'" target="_blank" onclick="event.stopPropagation()" class="link" title="Open on Suno">↗</a>'
            +'</div>';
    }
    document.getElementById('queue').innerHTML=html;
    document.getElementById('qcount').textContent='('+shown+(hidePlayed&&shown<T.length?' / '+T.length:'')+')';
}

/* --- Persist settings --- */
function saveSettings(){
    localStorage.setItem('player-channel',document.getElementById('channelSel').value);
    localStorage.setItem('player-limit',document.getElementById('limitInput').value);
    localStorage.setItem('player-autoload',autoloadEnabled?'1':'0');
    localStorage.setItem('player-time',String(timeFilterDays));
    localStorage.setItem('player-artist',artistFilter||'');
}
function loadSettings(){
    var ch=localStorage.getItem('player-channel');
    var lim=localStorage.getItem('player-limit');
    var al=localStorage.getItem('player-autoload');
    var tf=localStorage.getItem('player-time');
    var af=localStorage.getItem('player-artist');
    if(ch!==null)document.getElementById('channelSel').value=ch;
    if(lim)document.getElementById('limitInput').value=lim;
    if(al==='1'){autoloadEnabled=true;document.getElementById('btnAutoload').classList.add('on');}
    if(tf){timeFilterDays=parseInt(tf)||0;document.getElementById('timeSel').value=tf;}
    if(af){artistFilter=af;/* will be selected after updateArtistOptions once songs resolve */}
}

/* --- Events --- */
document.getElementById('btnFetch').onclick=function(){saveSettings();fetchSongs(false);};
document.getElementById('btnPlay').onclick=function(){
    if(!T.length)return;
    if(cur>=0){if(player.paused)player.play();else player.pause();return;}
    var start=0;
    while(start<T.length&&_skip(start))start++;
    if(start<T.length)play(start);
};
document.getElementById('artistSel').onchange=function(){artistFilter=this.value;saveSettings();renderQ();};
document.getElementById('timeSel').onchange=function(){timeFilterDays=parseInt(this.value)||0;saveSettings();renderQ();};
document.getElementById('rng').oninput=function(){
    tSec=parseInt(this.value);
    document.getElementById('rlbl').textContent=tSec?fmt(tSec):'OFF';
    if(tSec&&cur>=0)resetCd();else stopCd();
};
document.getElementById('channelSel').onchange=function(){saveSettings();};
document.getElementById('limitInput').onchange=function(){saveSettings();};

/* --- Live Frequency Spectrum --- */
var _specCtx=null, _specAnalyser=null, _specSrc=null, _specFrame=null;
function initSpectrum(){
    if(_specSrc)return true;
    try{
        _specCtx=new(window.AudioContext||window.webkitAudioContext)();
        _specSrc=_specCtx.createMediaElementSource(player);
        _specAnalyser=_specCtx.createAnalyser();
        _specAnalyser.fftSize=2048;
        _specSrc.connect(_specAnalyser);
        _specAnalyser.connect(_specCtx.destination);
        return true;
    }catch(e){console.warn('Spectrum init failed',e);return false;}
}
function drawSpectrum(){
    var c=document.getElementById('spectrum-canvas');
    if(!c||!_specAnalyser)return;
    var ctx=c.getContext('2d');
    // size canvas to CSS pixels
    var rect=c.getBoundingClientRect();
    if(c.width!==Math.floor(rect.width)||c.height!==Math.floor(rect.height)){
        c.width=Math.floor(rect.width);c.height=Math.floor(rect.height);
    }
    var data=new Uint8Array(_specAnalyser.frequencyBinCount);
    // Pre-compute logarithmic bin edges (music-perception: more resolution in lows)
    var bars=48;
    var minBin=1, maxBin=Math.min(data.length, Math.floor(data.length*0.75)); // skip silent top range
    var logMin=Math.log(minBin), logMax=Math.log(maxBin);
    var binEdges=new Array(bars+1);
    for(var k=0;k<=bars;k++){
        binEdges[k]=Math.floor(Math.exp(logMin+(logMax-logMin)*k/bars));
    }
    function loop(){
        _specFrame=requestAnimationFrame(loop);
        _specAnalyser.getByteFrequencyData(data);
        var w=c.width,h=c.height;
        ctx.clearRect(0,0,w,h);
        var gap=2, barW=(w-gap*(bars-1))/bars;
        for(var i=0;i<bars;i++){
            var start=binEdges[i], end=Math.max(binEdges[i+1], start+1);
            var peak=0;
            for(var j=start;j<end;j++){ if(data[j]>peak) peak=data[j]; }
            var bh=(peak/255)*h*0.95;
            var x=i*(barW+gap);
            var y=h-bh;
            var g=ctx.createLinearGradient(0,y,0,h);
            g.addColorStop(0,'#a78bfa');g.addColorStop(1,'#4c2a8a');
            ctx.fillStyle=g;
            ctx.fillRect(x,y,barW,bh);
        }
    }
    loop();
}
player.addEventListener('play',function(){
    if(initSpectrum()){
        if(_specCtx&&_specCtx.state==='suspended')_specCtx.resume();
        if(!_specFrame)drawSpectrum();
    }
});

/* Auto-load on page open */
loadSettings();
fetchSongs(false);
</script>

logLevel: info
logDestinations: [stdout]

# Used only inside the Compose network by the audio-only relay. No RTSP port is
# exposed on the host.
rtsp: true
rtspAddress: :8554
rtmp: true
rtmpAddress: :1935
srt: false

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["https://bot.macfreun.de"]
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentCount: 36
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: true
webrtcAddress: :8889

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false

paths:
  trya-dcs:
    source: publisher
  trya-dcs-audio:
    source: publisher

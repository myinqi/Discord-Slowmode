services:
  slowmode-bot:
    build: .
    container_name: slowmode-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "1936:1936"
    volumes:
      - bot-data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/bot.db
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b-instruct
      - WEB_URL=http://v2202502254147313270.goodsrv.de:5000
      # Persist HuggingFace / faster-whisper model cache inside bot-data
      # volume so the ~1.5 GB large-v3-turbo model is not re-downloaded on
      # every `docker compose up --build`.
      - HF_HOME=/app/data/hf_cache
      # Local timezone so the exp_radio auto-start scheduler matches the
      # clock time entered in the admin UI. Without this the container
      # defaults to UTC and would fire ~2 hours late (or 1h during winter).
      - TZ=Europe/Berlin
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: slowmode-ollama
    restart: unless-stopped
    # No host port exposed on purpose: only reachable from the bot container
    # (internal isolation). Uncomment to debug from host:
    # ports:
    #   - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    # Pull the model on first start, then run the server.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       pid=$!;
       until ollama list >/dev/null 2>&1; do sleep 1; done;
       ollama pull qwen2.5:7b-instruct || true;
       wait $pid"

volumes:
  bot-data:
  ollama-data:
